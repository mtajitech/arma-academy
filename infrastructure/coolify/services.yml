    internal_only: true
    healthcheck:
      path: /health
      interval: 30s
      timeout: 10s
    resources:
      cpu: 2
      memory: 1Gi              # Higher — video transcoding workloads
    env_secrets:
      - DATABASE_URL
      - REDIS_URL
      - JWT_SECRET
      - CDN_SECRET_KEY

  - name: ukb-service
    image: ghcr.io/GITHUB_ORG/arma-academy/ukb-service:latest
    port: 3004
