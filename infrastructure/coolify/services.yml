# ─── ARMA Academy — Coolify Deployment Configuration ─────────────────────────
# One application entry per service.
# Traefik handles domain routing and SSL termination via Let's Encrypt.
# IMPORTANT: Never change port numbers — they are hardcoded platform constants.
# ─────────────────────────────────────────────────────────────────────────────

environment: production
registry: ghcr.io
image_prefix: ghcr.io/GITHUB_ORG/arma-academy  # Replace GITHUB_ORG with your GitHub org

ssl:
  provider: letsencrypt
  email: tech@africarisk.net

# ─── Domain Routing (via Traefik) ────────────────────────────────────────────
domains:
  academy:     training.africarisk.net        # → frontend-academy (3100)
  api:         api.training.africarisk.net    # → api-gateway (3000)
  robo:        robo.training.africarisk.net   # → frontend-robo (3101)
  institutional: institutional.training.africarisk.net  # → frontend-institutional (3102)
  developer:   developer.training.africarisk.net        # → developer-portal (3103)

# ─── Services ────────────────────────────────────────────────────────────────
services:

  - name: api-gateway
    image: ghcr.io/GITHUB_ORG/arma-academy/api-gateway:latest
    port: 3000
    environment: production
    domain: api.training.africarisk.net
    traefik:
      rule: Host(`api.training.africarisk.net`)
      entrypoints: [websecure]
      tls: { certresolver: letsencrypt }
      middlewares:
        - rate-limit
        - cors-headers
    healthcheck:
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
    resources:
      cpu: 1
      memory: 512Mi
    env_secrets:
      - REDIS_URL
      - JWT_SECRET

  - name: auth-service
    image: ghcr.io/GITHUB_ORG/arma-academy/auth-service:latest
    port: 3001
    environment: production
    internal_only: true          # Not exposed externally — accessed via API gateway
    healthcheck:
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
    resources:
      cpu: 0.5
      memory: 256Mi
    env_secrets:
      - DATABASE_URL
      - REDIS_URL
      - JWT_SECRET

  - name: lms-core
    image: ghcr.io/GITHUB_ORG/arma-academy/lms-core:latest
    port: 3002
    environment: production
    internal_only: true
    healthcheck:
